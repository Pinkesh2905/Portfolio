<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="512" height="512">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#171c44"/>
      <stop offset="1" stop-color="#04071a"/>
    </linearGradient>
    <linearGradient id="bars" gradientUnits="userSpaceOnUse" x1="140" y1="400" x2="400" y2="120">
      <stop offset="0" stop-color="#7c4dea"/>
      <stop offset="0.55" stop-color="#b597ff"/>
      <stop offset="1" stop-color="#7ae6ff"/>
    </linearGradient>
    <linearGradient id="spark" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#8fdc00"/>
      <stop offset="1" stop-color="#d6ff70"/>
    </linearGradient>
    <linearGradient id="rim" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ba9eff" stop-opacity=".6"/>
      <stop offset=".5" stop-color="#ba9eff" stop-opacity=".06"/>
      <stop offset="1" stop-color="#00f4fe" stop-opacity=".4"/>
    </linearGradient>
    <radialGradient id="glow" cx=".28" cy=".22" r=".85">
      <stop offset="0" stop-color="#8455ef" stop-opacity=".5"/>
      <stop offset="1" stop-color="#8455ef" stop-opacity="0"/>
    </radialGradient>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="12"/>
    </filter>
  </defs>

  <!-- tile -->
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#bg)"/>
  <rect x="8" y="8" width="496" height="496" rx="116" fill="url(#glow)"/>
  <rect x="9.5" y="9.5" width="493" height="493" rx="114.5" fill="none" stroke="url(#rim)" stroke-width="3"/>

  <g transform="translate(-24 33)">
    <!-- E as a rising staircase: bar ends sit on one forward-leaning diagonal -->
    <polygon fill="url(#bars)" stroke="url(#bars)" stroke-width="14" stroke-linejoin="round"
      points="138,152 382,152 358,208 202,208 202,238 342,238 318,294 202,294 202,324 302,324 278,380 138,380"/>
    <!-- the next step -->
    <polygon fill="#a2f31f" opacity=".55" filter="url(#soft)" points="366,66 422,66 398,122 342,122"/>
    <polygon fill="url(#spark)" stroke="url(#spark)" stroke-width="14" stroke-linejoin="round"
      points="366,66 422,66 398,122 342,122"/>
  </g>
</svg>
