<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="1024" height="1024">
  <title>AURA — app icon</title>
  <defs>
    <linearGradient id="halo" x1="60" y1="420" x2="452" y2="92" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00f5ff"/>
      <stop offset="0.5" stop-color="#6f4cff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <linearGradient id="chrome" x1="256" y1="140" x2="256" y2="372" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#ffffff"/>
      <stop offset="0.45" stop-color="#d8e2ff"/>
      <stop offset="1" stop-color="#ff7ae8"/>
    </linearGradient>
    <linearGradient id="wave" x1="0" y1="262" x2="0" y2="352" gradientUnits="userSpaceOnUse">
      <stop offset="0" stop-color="#00f5ff"/>
      <stop offset="1" stop-color="#ff2bd6"/>
    </linearGradient>
    <radialGradient id="bgGlow" cx="50%" cy="46%" r="60%">
      <stop offset="0" stop-color="#2a0f5e"/>
      <stop offset="0.55" stop-color="#120a34"/>
      <stop offset="1" stop-color="#05030f"/>
    </radialGradient>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#ff2bd6" stop-opacity="0.38"/>
      <stop offset="1" stop-color="#ff2bd6" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="7" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="soft" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>

  <rect width="512" height="512" rx="116" fill="url(#bgGlow)"/>
  <circle cx="256" cy="262" r="150" fill="url(#core)"/>

  <!-- aura halo rings -->
  <g fill="none" stroke-linecap="round">
    <circle cx="256" cy="256" r="188" stroke="url(#halo)" stroke-width="22" opacity="0.5" filter="url(#soft)"
            stroke-dasharray="1010 170" transform="rotate(-14 256 256)"/>
    <circle cx="256" cy="256" r="188" stroke="url(#halo)" stroke-width="9"
            stroke-dasharray="1010 170" transform="rotate(-14 256 256)" filter="url(#glow)"/>
    <circle cx="256" cy="256" r="162" stroke="url(#halo)" stroke-width="2.5" opacity="0.55"
            stroke-dasharray="3 11" transform="rotate(20 256 256)"/>
  </g>

  <!-- the A -->
  <g fill="none" stroke-linecap="round" stroke-linejoin="round">
    <path d="M172 366 L256 150 L340 366" stroke="url(#chrome)" stroke-width="30" filter="url(#glow)"/>
    <path d="M172 366 L256 150 L340 366" stroke="#ffffff" stroke-width="3" opacity="0.55"/>
  </g>

  <!-- equalizer crossbar -->
  <g stroke="url(#wave)" stroke-width="11" stroke-linecap="round" filter="url(#glow)">
    <line x1="221" y1="296" x2="221" y2="322"/>
    <line x1="238.5" y1="280" x2="238.5" y2="338"/>
    <line x1="256" y1="262" x2="256" y2="352"/>
    <line x1="273.5" y1="280" x2="273.5" y2="338"/>
    <line x1="291" y1="296" x2="291" y2="322"/>
  </g>

  <!-- Y2K sparkles -->
  <path d="M398 104 L405 129 L430 136 L405 143 L398 168 L391 143 L366 136 L391 129 Z" fill="#b6ff00" filter="url(#glow)"/>
  <path d="M112 360 L116 374 L130 378 L116 382 L112 396 L108 382 L94 378 L108 374 Z" fill="#00f5ff" filter="url(#glow)"/>
</svg>
